openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CPR class scheduling platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: users
  - name: classes
  - name: enrollments
  - name: requests
  - name: certificates
  - name: dashboard
  - name: locations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: No Content

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ClassStatus" }
        - name: instructorId
          in: query
          required: false
          schema: { type: integer }
        - name: upcoming
          in: query
          required: false
          schema: { type: boolean }
        - name: location
          in: query
          required: false
          schema: { type: string }
          description: Filter classes whose location contains this string (case-insensitive)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
    post:
      operationId: createClass
      tags: [classes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSession" }
  /classes/{classId}:
    get:
      operationId: getClass
      tags: [classes]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
    patch:
      operationId: updateClass
      tags: [classes]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSession" }
    delete:
      operationId: deleteClass
      tags: [classes]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /classes/{classId}/enrollments:
    get:
      operationId: listClassEnrollments
      tags: [enrollments]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Enrollment" }
    post:
      operationId: enrollStudent
      tags: [enrollments]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
  /enrollments/{enrollmentId}:
    patch:
      operationId: updateEnrollment
      tags: [enrollments]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
    delete:
      operationId: deleteEnrollment
      tags: [enrollments]
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /enrollments:
    get:
      operationId: listEnrollments
      tags: [enrollments]
      parameters:
        - name: studentId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnrollmentWithClass" }

  /classes/{classId}/roster/{position}:
    patch:
      operationId: updateRosterEntry
      tags: [classes]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer }
        - name: position
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassRosterEntryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRosterEntry" }

  /roster-attendees:
    get:
      operationId: listRosterAttendees
      tags: [classes]
      responses:
        "200":
          description: Roster names across all classes (one row per non-blank attendee).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RosterAttendee" }

  /classes/{classId}/roster:
    get:
      operationId: getClassRoster
      tags: [classes]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRoster" }
    put:
      operationId: saveClassRoster
      tags: [classes]
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassRosterInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRoster" }

  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/RequestStatus" }
        - name: requestorId
          in: query
          required: false
          schema: { type: integer }
        - name: email
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassRequest" }
    post:
      operationId: createRequest
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRequest" }
  /training-requests:
    post:
      operationId: submitTrainingRequest
      tags: [requests]
      description: Public-style intake form. Creates (or reuses by email) a requestor and submits a training request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRequest" }
  /requests/{requestId}:
    get:
      operationId: getRequest
      tags: [requests]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRequest" }
    patch:
      operationId: updateRequest
      tags: [requests]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassRequestUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRequest" }

  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      parameters:
        - name: studentId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Certificate" }
    post:
      operationId: createCertificate
      tags: [certificates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
  /dashboard/instructor/{instructorId}:
    get:
      operationId: getInstructorDashboard
      tags: [dashboard]
      parameters:
        - name: instructorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstructorDashboard" }
  /dashboard/student/{studentId}:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDashboard" }
  /dashboard/requestor/{requestorId}:
    get:
      operationId: getRequestorDashboard
      tags: [dashboard]
      parameters:
        - name: requestorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestorDashboard" }
  /dashboard/activity:
    get:
      operationId: getActivityFeed
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all locations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LocationDetail" }
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationDetail" }

  /locations/{locationId}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a location with stats
      parameters:
        - name: locationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationDetail" }
        "404": { description: Not found }
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location
      parameters:
        - name: locationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationDetail" }
        "404": { description: Not found }
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location
      parameters:
        - name: locationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  /locations/{locationId}/notes:
    post:
      operationId: createLocationNote
      tags: [locations]
      summary: Add a communication note to a location
      parameters:
        - name: locationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationNoteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationNote" }
        "404": { description: Not found }

  /locations/{locationId}/notes/{noteId}:
    delete:
      operationId: deleteLocationNote
      tags: [locations]
      summary: Delete a location note
      parameters:
        - name: locationId
          in: path
          required: true
          schema: { type: integer }
        - name: noteId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  /reminders:
    get:
      operationId: listReminders
      tags: [reminders]
      summary: List class reminders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, sent, dismissed]
        - name: due
          in: query
          required: false
          description: Only return reminders where triggerDate <= today
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reminder" }

  /reminders/{reminderId}:
    patch:
      operationId: updateReminder
      tags: [reminders]
      summary: Update reminder status
      parameters:
        - name: reminderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "404": { description: Not found }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UserRole:
      type: string
      enum: [administrator, instructor, student, requestor]

    CertificationType:
      type: string
      enum: [cpr_aed_first_aid, stop_the_bleed, cpr_aed_first_aid_stop_the_bleed]

    ClassStatus:
      type: string
      enum: [being_scheduled, pending_schedule, confirmed, completed, cancelled, scheduled]

    RequestStatus:
      type: string
      enum: [pending, approved, rejected, scheduled]

    EnrollmentStatus:
      type: string
      enum: [registered, attended, no_show, cancelled]

    AdminRole:
      type: string
      enum: [admin, coordinator, ehs]
      description: Sub-role for administrator accounts — used to filter email notifications.

    User:
      type: object
      required: [id, name, email, role, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        adminRole:
          $ref: "#/components/schemas/AdminRole"
          nullable: true
        phone: { type: ["string", "null"] }
        organization: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string }

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        adminRole: { $ref: "#/components/schemas/AdminRole" }
        phone: { type: string }
        organization: { type: string }
        bio: { type: string }
        avatarUrl: { type: string }
        isActive: { type: boolean }

    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        adminRole: { $ref: "#/components/schemas/AdminRole" }
        phone: { type: string }
        organization: { type: string }
        bio: { type: string }
        avatarUrl: { type: string }
        isActive: { type: boolean }

    ClassSession:
      type: object
      required:
        [
          id,
          title,
          certificationType,
          date,
          startTime,
          location,
          capacity,
          enrolledCount,
          status,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        certificationType: { $ref: "#/components/schemas/CertificationType" }
        date: { type: string }
        startTime: { type: string }
        endTime: { type: ["string", "null"] }
        location: { type: string }
        capacity: { type: integer }
        enrolledCount: { type: integer }
        status: { $ref: "#/components/schemas/ClassStatus" }
        instructorId: { type: ["integer", "null"] }
        instructorName: { type: ["string", "null"] }
        instructors:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        description: { type: ["string", "null"] }
        businessUnit: { type: ["string", "null"] }

    TrainerInviteStatus:
      type: string
      enum: [pending, accepted, declined]

    TrainerInvitation:
      type: object
      required: [id, userId, trainerName, status]
      properties:
        id: { type: integer }
        userId: { type: integer }
        trainerName: { type: string }
        status: { $ref: "#/components/schemas/TrainerInviteStatus" }
        respondedAt: { type: string, nullable: true }

    ClassDetail:
      allOf:
        - $ref: "#/components/schemas/ClassSession"
        - type: object
          properties:
            enrollments:
              type: array
              items: { $ref: "#/components/schemas/Enrollment" }
            trainerInvitations:
              type: array
              items: { $ref: "#/components/schemas/TrainerInvitation" }

    ClassInput:
      type: object
      required:
        [title, certificationType, date, startTime, location, capacity]
      properties:
        title: { type: string, minLength: 1 }
        certificationType: { $ref: "#/components/schemas/CertificationType" }
        date: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string }
        capacity: { type: integer, minimum: 1 }
        instructorIds:
          type: array
          items: { type: integer }
        status: { $ref: "#/components/schemas/ClassStatus" }
        description: { type: string }
        businessUnit: { type: string }

    RosterResult:
      type: string
      enum: [pass, fail]

    RosterAttendee:
      type: object
      required:
        [classId, position, classTitle, classDate, classLocation, name, cardSent]
      properties:
        classId: { type: integer }
        position: { type: integer }
        classTitle: { type: string }
        classDate: { type: string }
        classLocation: { type: string }
        name: { type: string }
        result:
          oneOf:
            - { $ref: "#/components/schemas/RosterResult" }
            - { type: "null" }
        cardSent: { type: boolean }

    ClassRosterEntryUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        result:
          oneOf:
            - { $ref: "#/components/schemas/RosterResult" }
            - { type: "null" }
        cardSent: { type: boolean }

    ClassRosterEntry:
      type: object
      required: [position, name, email, phone, cardSent]
      properties:
        position: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        result:
          oneOf:
            - { $ref: "#/components/schemas/RosterResult" }
            - { type: "null" }
        cardSent: { type: boolean }

    ClassRoster:
      type: object
      required: [classId, capacity, entries]
      properties:
        classId: { type: integer }
        capacity: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ClassRosterEntry" }

    ClassRosterInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ClassRosterEntry" }

    ClassUpdate:
      type: object
      properties:
        title: { type: string }
        certificationType: { $ref: "#/components/schemas/CertificationType" }
        date: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string }
        capacity: { type: integer }
        instructorIds:
          type: array
          items: { type: integer }
        description: { type: string }
        businessUnit: { type: string }
        status: { $ref: "#/components/schemas/ClassStatus" }

    Enrollment:
      type: object
      required: [id, classId, studentId, studentName, status, enrolledAt]
      properties:
        id: { type: integer }
        classId: { type: integer }
        studentId: { type: integer }
        studentName: { type: string }
        studentEmail: { type: string }
        status: { $ref: "#/components/schemas/EnrollmentStatus" }
        certificateIssued: { type: boolean }
        enrolledAt: { type: string }

    EnrollmentWithClass:
      type: object
      required: [id, classId, studentId, status, enrolledAt, classSession]
      properties:
        id: { type: integer }
        classId: { type: integer }
        studentId: { type: integer }
        status: { $ref: "#/components/schemas/EnrollmentStatus" }
        certificateIssued: { type: boolean }
        enrolledAt: { type: string }
        classSession: { $ref: "#/components/schemas/ClassSession" }

    EnrollmentInput:
      type: object
      required: [studentId]
      properties:
        studentId: { type: integer }

    EnrollmentUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/EnrollmentStatus" }
        certificateIssued: { type: boolean }

    ClassRequest:
